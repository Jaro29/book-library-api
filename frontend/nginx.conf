server {
    listen 80;
    server_name afterword.coffe.ink;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name afterword.coffe.ink;

    ssl_certificate /etc/letsencrypt/live/afterword.coffe.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afterword.coffe.ink/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}