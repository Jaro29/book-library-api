<h2>Lista książek</h2>

<ul>
  @for (book of books(); track book.id) {
<li>
@if (editingBookId() === book.id) {
  <app-edit-book-form [book]="book" (saved)="cancelEdit()" (cancelled)="cancelEdit()" />
} @else {
  {{ book.title }} — {{ book.author }} ({{ book.status }})
  <button (click)="startEdit(book.id)">Edytuj</button>
  <button (click)="onDelete(book.id)">Usuń</button>
}
</li>
  }
</ul>

<button (click)="previousPage()" [disabled]="currentPage() === 0">Poprzednia</button>
<span>Strona {{ currentPage() + 1 }} z {{ totalPages() }}</span>
<button (click)="nextPage()" [disabled]="currentPage() + 1 >= totalPages()">Następna</button>
